name: Quick modal detail fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/quick-modal-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enhance vehicle detail modal
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* NM_MODAL_ENHANCEMENT */'
          if marker not in s:
              css='''<style>/* NM_MODAL_ENHANCEMENT */.nmDetailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.nmDetailGrid div{padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.nmDetailGrid span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.nmDetailGrid b{display:block;color:var(--text);font-size:14px}.nmDetailNote{padding:13px 14px;border-radius:14px;background:rgba(201,167,106,.08);border:1px solid rgba(201,167,106,.22);color:#ead7b2;font-size:13px;line-height:1.6;margin:12px 0 0}</style>'''
              js='''<script>document.addEventListener('click',function(e){const mini=e.target.closest('.mini');if(mini){setTimeout(function(){try{const code=mini.getAttribute('onclick')||'';const m=code.match(/openM\\(['\"]([^'\"]+)['\"]\\)/);if(!m||typeof cars==='undefined')return;const x=cars.find(v=>v.id===m[1]);if(!x)return;const modal=document.querySelector('.modal');if(!modal)return;const box=modal.querySelector('.md')||modal.querySelector('[class*=modal]');if(!box)return;box.querySelectorAll('.nmDetailGrid,.nmDetailNote').forEach(n=>n.remove());const grid=document.createElement('div');grid.className='nmDetailGrid';grid.innerHTML=`<div><span>Marka</span><b>${x.brand||'—'}</b></div><div><span>Model Yılı</span><b>${x.year||'—'}</b></div><div><span>Kategori</span><b>${x.cat||x.category||'—'}</b></div><div><span>Durum</span><b>${x.status||'—'}</b></div><div><span>Yakıt</span><b>${x.fuel||'—'}</b></div><div><span>Şanzıman</span><b>${x.trans||'—'}</b></div><div><span>Kilometre</span><b>${x.km||'—'}</b></div><div><span>Seçki</span><b>${x.badge||'Özel Seçki'}</b></div>`;const p=box.querySelector('p');if(p)p.insertAdjacentElement('afterend',grid);else box.appendChild(grid);const note=document.createElement('div');note.className='nmDetailNote';note.textContent='Güncel fiyat, stok durumu ve ek donanım bilgileri Metrikon Automotive tarafından yönetilebilir.';grid.insertAdjacentElement('afterend',note);const jump=box.querySelector('a.btn[href="#iletisim"],a.btn[href="#contact"]');if(jump){jump.textContent='Detayları Gör';jump.removeAttribute('href');jump.onclick=function(ev){ev.preventDefault();ev.stopPropagation();};}},0);}const jump=e.target.closest('.modal a.btn[href="#iletisim"],.modal a.btn[href="#contact"]');if(jump){e.preventDefault();e.stopPropagation();jump.textContent='Detayları Gör';}},true);</script>'''
              s=s.replace('</head>',css+'</head>',1)
              s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'northmedia-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Enhance vehicle details and remove contact jump' || exit 0
          git push origin main

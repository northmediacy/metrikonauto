name: Publish M Deniz soft premium final
on:
  push:
    paths:
      - '.github/workflows/publish-mdeniz-soft-final.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write final HTML
        env:
          HTML_B64: ' ... (truncated due to size)'
        run: |
          python - <<'PY'
          import os,base64,pathlib
          data=base64.b64decode(os.environ['HTML_B64'])
          pathlib.Path('mdeniz/index.html').write_bytes(data)
          PY
      - name: Commit final site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mdeniz/index.html
          git commit -m 'Publish M Deniz soft premium final' || exit 0
          git push

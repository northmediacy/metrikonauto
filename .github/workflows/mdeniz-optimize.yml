name: Optimize M Deniz images
on:
  push:
    paths:
      - '.github/workflows/mdeniz-optimize.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Optimize showroom photos
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          for p in Path('mdeniz/assets').glob('*.jpg'):
              im=Image.open(p).convert('RGB')
              im=ImageOps.exif_transpose(im)
              im.thumbnail((1800,1350), Image.Resampling.LANCZOS)
              im.save(p,'JPEG',quality=82,optimize=True,progressive=True)
              print(p, p.stat().st_size)
          PY
      - name: Commit optimized photos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mdeniz/assets
          if git diff --cached --quiet; then echo nochange; else git commit -m 'Optimize M Deniz showroom images'; git push; fi
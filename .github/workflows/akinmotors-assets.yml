name: Akın Motors verified assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/akinmotors-assets.yml'
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified dealer listing images
        run: |
          mkdir -p akinmotors/assets
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          curl -L --fail --retry 4 -A "$UA" -e 'https://www.kktcarabam.com/' 'https://www.kktcarabam.com/uploads/images/2026/04/24/16/702948-9889734160-69eb698bba3c6-900_675.jpg' -o akinmotors/assets/range.jpg
          sleep 2
          curl -L --fail --retry 4 -A "$UA" -e 'https://www.kktcarabam.com/' 'https://www.kktcarabam.com/uploads/images/2026/04/27/13/image-69ef3620d9493-900_675.jpg' -o akinmotors/assets/hilux.jpg
          sleep 2
          curl -L --fail --retry 4 -A "$UA" -e 'https://www.kktcarabam.com/' 'https://www.kktcarabam.com/uploads/images/2026/04/13/12/img-6338-69dcb37d2536b-900_675.jpg' -o akinmotors/assets/rav4.jpg
          file akinmotors/assets/*.jpg
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add akinmotors/assets
          git diff --cached --quiet && exit 0
          git commit -m 'Add Akın Motors verified vehicle images'
          git push
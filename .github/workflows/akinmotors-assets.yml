name: Akın Motors verified assets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/akinmotors-assets.yml'
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified dealer listing images
        run: |
          mkdir -p akinmotors/assets
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131 Safari/537.36'
          curl -L --fail --retry 4 -A "$UA" -e 'https://www.kktcarabam.com/' 'https://www.kktcarabam.com/uploads/images/2026/04/24/16/702948-9889734160-69eb698bba3c6-900_675.jpg' -o akinmotors/assets/range.jpg
          sleep 2
          curl -L --fail --retry 4 -A "$UA" -e 'https://www.kktcarabam.com/' 'https://www.kktcarabam.com/uploads/images/2026/04/27/13/image-69ef3620d9493-900_675.jpg' -o akinmotors/assets/hilux.jpg
          file akinmotors/assets/*.jpg
      - name: Remove unverified RAV4 card from demo
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('akinmotors/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("<button data-f=\"Hibrit\">Hibrit</button>","")
          start="{id:'rav4',name:'Toyota RAV4 2.0',year:'2023',km:'23.000 KM',fuel:'Benzin',gear:'Otomatik',body:'SUV',price:'£29.950',img:'assets/rav4.jpg',desc:'Yeşil renk, otomatik, 2.0 benzinli SUV.'}"
          s=s.replace(','+start,'')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit assets and clean demo
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add akinmotors
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize Akın Motors verified demo assets'
          git push
name: Clean Luxury 27 portfolio
on:
  push:
    paths:
      - '.github/workflows/luxury27-clean-portfolio.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove cards without localized images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('luxury27/index.html')
          s=p.read_text(encoding='utf-8')
          for key in ['bmw320','a4','mini','yaris']:
              s,n=re.subn(r"\{id:'"+key+r"'.*?\},(?=\{id:)","",s,count=1)
              if n==0:
                  s,n=re.subn(r",\{id:'"+key+r"'.*?\}(?=\];)","",s,count=1)
              print(key,n)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add luxury27/index.html
          if git diff --cached --quiet; then echo nochange; else git commit -m 'Show only photo-backed Luxury 27 vehicles'; git push; fi